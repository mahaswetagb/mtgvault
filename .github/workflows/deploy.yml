name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: Inject optional Google Client ID
        if: ${{ vars.GOOGLE_CLIENT_ID != '' }}
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/app/config.ts';
          const source = fs.readFileSync(path, 'utf8');
          const placeholder = "export const GOOGLE_CLIENT_ID = '';";
          const configured = `export const GOOGLE_CLIENT_ID = ${JSON.stringify(process.env.GOOGLE_CLIENT_ID)};`;
          fs.writeFileSync(path, source.replace(placeholder, configured));
          NODE
      - run: npx ng build --base-href /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/mtg-vault/browser }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
